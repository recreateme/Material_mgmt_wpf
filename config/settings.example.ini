# 复制为 settings.ini 后按需修改（settings.ini 不纳入 Git）
# 电子天平与扫码枪须使用不同 COM 口

[serial]
port =
baud_rate = 9600
auto_connect = true
# 调试用：把天平收发的原始帧写入 logs/app.log（约每秒 10 行），排查完请改回 false
raw_frame_log = false

[scanner]
port =
baud_rate = 9600
mode = Auto
enabled = true

[app]
window_width = 1280
window_height = 800
window_maximized = false
# 称量提示音（合格/超范围/错码/读数中断）；设置页可开关、选音量与试听
sound_enabled = true
# 提示音音量：low / medium / high
sound_volume = medium
# 登录背景默认只用随包的 Assets\login-bg.jpg；设为 true 且本地图缺失时才尝试在线下载（5 秒超时）
login_bg_online = false

[migration]
# 仅升级很旧的库时使用：旧版曾用个人账号充当管理员时填其用户名，启动时合并为 admin（密码不变）。留空不处理
legacy_admin_username =
